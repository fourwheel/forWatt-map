<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>for.Watt – Netzadeckung · VNB-Karte Deutschland</title>
  <link rel="icon" type="image/svg+xml" href="assets/forwatt-favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading">Lade Kartendaten…</div>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <img class="fw-logo" src="assets/forwatt-logo.svg" alt="for.Watt" />
        <h1>Messstellenbetreiber-Abdeckung</h1>
        <p class="sub">VNB-Karte Deutschland · Smart-Meter-Rollout <span id="period-label">Q4 2025</span></p>
      </div>

      <!-- Kartenmodus-Filter vorübergehend deaktiviert (nicht benötigt).
      <div class="panel">
        <div class="panel-title">Kartenmodus</div>
        <div class="segmented" id="mode-seg">
          <button data-mode="sm" class="active">Smart-Meter-Quote</button>
          <button data-mode="mc">Anzahl Zähler</button>
        </div>
        <div class="metric-row" id="sm-metric-row">
          <label><input type="radio" name="smmetric" value="mit" checked /> Mit opt. Einbaufällen</label>
          <label><input type="radio" name="smmetric" value="ohne" /> Ohne opt. Einbaufälle</label>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      -->

      <div class="panel forwatt-panel">
        <!-- Überschrift entfernt: "for.Watt-Abdeckung" war eine zweite, redundante Heading.
        Schalter deaktiviert: for.Watt-Abdeckung ist dauerhaft aktiv.
        <div class="panel-title">
          <label class="switch">
            <input type="checkbox" id="forwatt-toggle" checked />
            <span class="slider"></span>
          </label>
          <span>for.Watt-Abdeckung</span>
        </div>
        -->
        <div class="forwatt-status" id="forwatt-status">wird geladen…</div>
        <div class="forwatt-summary" id="forwatt-summary"></div>
        <div class="forwatt-list" id="forwatt-list"></div>
      </div>

      <!-- Filter-Panel vorübergehend deaktiviert (nicht benötigt).
      <div class="panel filters">
        <div class="panel-title">Filter</div>
        <div class="filter">
          <div class="filter-head"><span>Smart-Meter-Quote</span><span id="sm-range-label">0 – 100 %</span></div>
          <div class="dual" id="sm-slider"></div>
        </div>
        <div class="filter">
          <div class="filter-head"><span>Zähler</span><span id="mc-range-label">0 – 4 Mio.</span></div>
          <div class="dual" id="mc-slider"></div>
        </div>
        <div class="filter-actions">
          <span id="vnb-count">793 / 793 VNB</span>
          <button id="reset-btn">Zurücksetzen</button>
        </div>
      </div>
      -->

      <!-- Ranking-Panel vorübergehend deaktiviert (nicht benötigt).
      <div class="panel list-panel">
        <div class="panel-title" id="list-title">Ranking Smart-Meter-Quote</div>
        <div class="vnb-list" id="vnb-list"></div>
      </div>
      -->

      <div class="panel credit">
        Erstellt von
        <a href="https://www.linkedin.com/in/tom-boyle-92345a17/" target="_blank" rel="noopener">Thomas Boyle</a>
        auf Basis der großartigen Arbeit von
        <a href="https://vnb-monitoring.org/" target="_blank" rel="noopener">vnb-monitoring.org</a>,
        angepasst von
        <a href="https://www.linkedin.com/in/laurin-vierrath/" target="_blank" rel="noopener">Laurin Vierrath</a>.
      </div>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle" title="Seitenleiste ein-/ausblenden">◀</button>
    <div id="map"></div>
  </div>

  <script src="lib/match.js"></script>
  <script src="app.js"></script>

</html>
